  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];

function render() {
  document.getElementById("tab-adivina").classList.toggle("active", modo === "adivina");
  document.getElementById("tab-construir").classList.toggle("active", modo === "construir");

  const scorebar = document.getElementById("scorebar");
  const main = document.getElementById("main");

  if (modo === "adivina") {
    scorebar.innerHTML = `<span>Pasajeros vistos: <b>${vistos}</b></span><span class="badge">Aciertos: ${aciertos}/${intentos}</span>`;
    renderAdivina(main);
  } else {
    scorebar.innerHTML = `<span>Modo laboratorio</span><span class="badge">Tasa histórica: ${Math.round(MODELO.tasa_base * 100)}%</span>`;
    renderConstruir(main);
  }
}

function renderAdivina(main) {
  let html = `<div class="card-id">Pasajero N&deg; ${String(actual.numero).padStart(2, "0")}</div>`;
  html += `<div class="intro-text">Toca cada pista para revelarla. Tú decides cuántas ver antes de responder.</div>`;
  html += `<div class="clues">`;
  for (const p of PISTAS) {
    const revelado = reveladas.has(p.key);
    const valor = revelado ? actual[p.key] : "Toca para revelar";
    html += `
      <button class="clue-btn ${revelado ? "revealed" : ""}" onclick="toggleClue('${p.key}')">
        <span class="label">${p.label}</span>
        <span class="value ${revelado ? "" : "hidden"}">${valor}</span>
      </button>`;
  }
  html += `</div>`;

  if (guessHecho === null) {
    html += `<div class="guess-title">¿Tu predicción?</div>`;
    html += `<div class="guess-row">
      <button class="guess-btn si" onclick="hacerGuess(true)">Sobrevivió</button>
      <button class="guess-btn no" onclick="hacerGuess(false)">No sobrevivió</button>
    </div>`;
  } else {
    const acerto = guessHecho === actual.sobrevivio;
    html += `<div class="result-panel ${acerto ? "acierto" : "fallo"}">
      <div class="veredicto">${acerto ? "¡Acertaste!" : "No acertaste"}</div>
      <div class="real">Este pasajero <b>${actual.sobrevivio ? "sí sobrevivió" : "no sobrevivió"}</b> al hundimiento.</div>
      <div class="full-details">
        ${PISTAS.map(p => `<div><b>${p.label}:</b> ${actual[p.key]}</div>`).join("")}
      </div>
      <button class="next-btn" onclick="siguientePasajero()">Siguiente pasajero</button>
    </div>`;
  }
  html += `<button class="reset-link" onclick="reiniciarJuego()">Reiniciar puntaje y mezclar de nuevo</button>`;
  main.innerHTML = html;
}

function renderConstruir(main) {
  let html = `<div class="intro-text">Arma un pasajero hipotético eligiendo todas sus características (incluida edad y sexo) y descubre qué probabilidad histórica de sobrevivir habría tenido, según un modelo entrenado con los 891 pasajeros reales del Titanic.</div>`;

  // Clase
  html += `<div class="campo-form">
    <div class="titulo-campo">Clase del pasaje</div>
    <div class="opciones-grupo">
      ${[1,2,3].map(c => `<button class="opcion-btn ${CONSTRUCTOR.clase===c?"selected":""}" onclick="setCampo('clase', ${c})">${c}ª clase</button>`).join("")}
    </div>
  </div>`;

  // Sexo
  html += `<div class="campo-form">
    <div class="titulo-campo">Sexo</div>
    <div class="opciones-grupo">
      <button class="opcion-btn ${CONSTRUCTOR.sexo==="hombre"?"selected":""}" onclick="setCampo('sexo', 'hombre')">Hombre</button>
      <button class="opcion-btn ${CONSTRUCTOR.sexo==="mujer"?"selected":""}" onclick="setCampo('sexo', 'mujer')">Mujer</button>
    </div>
  </div>`;

  // Edad
  html += `<div class="campo-form">
    <div class="titulo-campo">Edad</div>
    <div class="slider-row">
      <input type="range" min="0" max="80" step="1" value="${CONSTRUCTOR.edad}" oninput="setCampo('edad', parseInt(this.value))">
    </div>
    <div class="slider-valor">${CONSTRUCTOR.edad} años</div>
  </div>`;

  // Título
  html += `<div class="campo-form">
    <div class="titulo-campo">Título social</div>
    <div class="opciones-grupo">
      ${Object.entries(TITULO_TEXTO).map(([k,v]) => `<button class="opcion-btn ${CONSTRUCTOR.titulo===k?"selected":""}" onclick="setCampo('titulo', '${k}')">${v}</button>`).join("")}
    </div>
  </div>`;

  // Familiares
  html += `<div class="campo-form">
    <div class="titulo-campo">Familiares a bordo (sin contarlo a él/ella)</div>
    <div class="stepper">
      <button onclick="cambiarFamiliares(-1)">−</button>
      <span class="valor">${CONSTRUCTOR.familiares === 0 ? "Viaja solo/a" : CONSTRUCTOR.familiares + " familiar(es)"}</span>
      <button onclick="cambiarFamiliares(1)">+</button>
    </div>
  </div>`;

  // Camarote
  html += `<div class="campo-form">
    <div class="titulo-campo">Camarote</div>
    <div class="opciones-grupo">
      <button class="opcion-btn ${CONSTRUCTOR.camarote===1?"selected":""}" onclick="setCampo('camarote', 1)">Con camarote registrado</button>
      <button class="opcion-btn ${CONSTRUCTOR.camarote===0?"selected":""}" onclick="setCampo('camarote', 0)">Sin camarote registrado</button>
    </div>
  </div>`;

  // Puerto
  html += `<div class="campo-form">
    <div class="titulo-campo">Puerto de embarque</div>
    <div class="opciones-grupo">
      ${Object.entries(PUERTO_TEXTO).map(([k,v]) => `<button class="opcion-btn ${CONSTRUCTOR.puerto===k?"selected":""}" onclick="setCampo('puerto', '${k}')">${v}</button>`).join("")}
    </div>
  </div>`;

  // Tarifa
  html += `<div class="campo-form">
    <div class="titulo-campo">Tarifa pagada</div>
    <div class="slider-row">
      <input type="range" min="0" max="200" step="1" value="${CONSTRUCTOR.tarifa}" oninput="setCampo('tarifa', parseInt(this.value))">
    </div>
    <div class="slider-valor">£${CONSTRUCTOR.tarifa}</div>
  </div>`;

  html += `<button class="calc-btn" onclick="calcularProbabilidad()">¿Sobrevive o no sobrevive?</button>`;

  if (probCalculada !== null) {
    const sobrevive = probCalculada >= 0.5;
    html += `<div class="prob-panel ${sobrevive ? "panel-si" : "panel-no"}">
      <div class="prob-veredicto">${sobrevive ? "SOBREVIVE" : "NO SOBREVIVE"}</div>
      <div class="prob-label">Según el modelo entrenado con los pasajeros reales del Titanic, un pasajero con estas características ${sobrevive ? "habría sobrevivido" : "no habría sobrevivido"} al hundimiento.</div>
    </div>`;
  }

  main.innerHTML = html;
}

nuevoMazo();
actual = mazo.pop();
vistos = 1;
render();
</script>
</body>
</html>
